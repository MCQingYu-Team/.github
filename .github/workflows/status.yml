name: Server status badge

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load the previous uptime history from the status branch
        run: |
          set -euo pipefail
          if git fetch origin status --depth=1 2>/dev/null &&
             git show origin/status:status-history.json > history.json; then
            echo "history loaded: $(jq '.samples | length' history.json) samples"
          else
            echo '{"samples": []}' > history.json
            echo "no history yet, starting fresh"
          fi

      - name: Query mc.aqcraft.cn
        run: |
          set -euo pipefail
          data=$(curl -fsS --max-time 20 https://api.mcsrvstat.us/3/mc.aqcraft.cn || echo '{}')
          if [ "$(printf '%s' "$data" | jq -r '.online // false')" = "true" ]; then
            echo "up" > state.txt
          else
            echo "down" > state.txt
          fi
          cat state.txt

      - name: Render server-status.json and uptime.svg
        run: python3 scripts/render-status.py "$(cat state.txt)"

      - name: Publish to the status branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-status.json uptime.svg status-history.json
          git commit -m "chore: update server status" || exit 0
          git push --force origin HEAD:status
